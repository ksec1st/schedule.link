<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>部活動スケジュール</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="header-inner">

      <div>
        <p class="header-sub">ESPORTS CLUB</p>
        <h1>部活動スケジュール</h1>
      </div>

      <button
        class="add-main-btn"
        onclick="openAddModal()"
      >
        ＋ 予定を追加
      </button>

    </div>

  </header>


  <main class="container">

    <section class="calendar-section">

      <div class="calendar-header">

        <button
          class="nav-btn"
          onclick="changeMonth(-1)"
        >
          ‹
        </button>

        <div class="month-area">

          <h2 id="monthTitle">
            2026年10月
          </h2>

          <button
            class="today-btn"
            onclick="goToday()"
          >
            今日
          </button>

        </div>

        <button
          class="nav-btn"
          onclick="changeMonth(1)"
        >
          ›
        </button>

      </div>


      <div class="calendar">

        <div class="weekdays">

          <div class="sunday">日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div class="saturday">土</div>

        </div>

        <div
          id="calendarDays"
          class="calendar-days"
        ></div>

      </div>

    </section>


    <section class="legend">

      <div class="legend-item">
        <span class="dot club"></span>
        部活動
      </div>

      <div class="legend-item">
        <span class="dot tournament"></span>
        大会・イベント
      </div>

      <div class="legend-item">
        <span class="dot trip"></span>
        遠征
      </div>

      <div class="legend-item">
        <span class="dot other"></span>
        その他
      </div>

    </section>

  </main>


  <!-- 予定追加・編集モーダル -->

  <div
    id="eventModal"
    class="modal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <div>
          <p class="modal-sub">SCHEDULE</p>
          <h2 id="modalTitle">
            予定を追加
          </h2>
        </div>

        <button
          class="close-btn"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>


      <form
        id="eventForm"
        onsubmit="saveEvent(event)"
      >

        <input
          type="hidden"
          id="eventId"
        >


        <div class="form-group">

          <label for="eventDate">
            日付
          </label>

          <input
            type="date"
            id="eventDate"
            required
          >

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="startTime">
              開始
            </label>

            <input
              type="time"
              id="startTime"
            >

          </div>


          <div class="form-group">

            <label for="endTime">
              終了
            </label>

            <input
              type="time"
              id="endTime"
            >

          </div>

        </div>


        <div class="form-group">

          <label for="eventTitle">
            予定名
          </label>

          <input
            type="text"
            id="eventTitle"
            placeholder="例：通常部活動"
            required
          >

        </div>


        <div class="form-group">

          <label for="location">
            場所
          </label>

          <input
            type="text"
            id="location"
            placeholder="例：eスポーツ室"
          >

        </div>


        <div class="form-group">

          <label for="category">
            カテゴリ
          </label>

          <select id="category">

            <option value="部活動">
              部活動
            </option>

            <option value="大会・イベント">
              大会・イベント
            </option>

            <option value="遠征">
              遠征
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="description">
            内容・メモ
          </label>

          <textarea
            id="description"
            rows="4"
            placeholder="持ち物や連絡事項など"
          ></textarea>

        </div>


        <div class="form-group">

          <label for="author">
            登録者
          </label>

          <input
            type="text"
            id="author"
            placeholder="例：部長"
          >

        </div>


        <div class="form-actions">

          <button
            type="button"
            id="deleteBtn"
            class="delete-btn"
            onclick="deleteEvent()"
            style="display:none;"
          >
            削除
          </button>

          <div class="right-actions">

            <button
              type="button"
              class="cancel-btn"
              onclick="closeModal()"
            >
              キャンセル
            </button>

            <button
              type="submit"
              class="save-btn"
            >
              保存する
            </button>

          </div>

        </div>

      </form>

    </div>

  </div>


  <div
    id="loading"
    class="loading"
  >
    読み込み中...
  </div>


  <script src="script.js"></script>

</body>

</html>
