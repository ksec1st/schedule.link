
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adminすけじゅーる｜KSEC 1st</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <div>
      <h1>KSEC 1st</h1>
      <p>スケジュール管理</p>
    </div>
    <a href="index.html" class="back-link">公開カレンダーへ戻る</a>
  </header>

  <main class="admin-container">
    <!-- ログイン -->
    <section id="loginPanel" class="panel">
      <h2>管理者ログイン</h2>
      <form id="loginForm">
        <label for="loginPassword">管理者パスワード</label>
        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          required
        >
        <button type="submit">ログイン</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <!-- 管理画面 -->
    <div id="adminApp" hidden>
      <div class="admin-toolbar">
        <h2>管理メニュー</h2>
        <button type="button" id="logoutButton" class="secondary-button">
          ログアウト
        </button>
      </div>

      <!-- 日程設定 -->
      <section class="panel">
        <h2 id="scheduleFormHeading">日程設定</h2>
        <p class="help-text">
          開始日から終了日まで、毎日に同じ予定を登録します。
          1日のみの場合は、開始日と終了日に同じ日付を指定してください。
        </p>

        <form id="scheduleForm">
          <input type="hidden" id="editingEventId">

          <div class="form-grid">
            <div class="form-field">
              <label for="startDate">開始日 <span class="required">必須</span></label>
              <input type="date" id="startDate" required>
            </div>

            <div class="form-field">
              <label for="endDate">終了日 <span class="required">必須</span></label>
              <input type="date" id="endDate" required>
            </div>
          </div>

          <p id="periodPreview" class="help-text" aria-live="polite">
            開始日と終了日を選択してください。
          </p>

          <div class="form-field">
            <label for="eventTitle">予定名 <span class="required">必須</span></label>
            <input
              type="text"
              id="eventTitle"
              maxlength="100"
              placeholder="例：秋季大会"
              required
            >
          </div>

          <div class="form-field">
            <label for="eventCategory">カテゴリ <span class="required">必須</span></label>
            <select id="eventCategory" required>
              <option value="">カテゴリを読み込み中...</option>
            </select>
          </div>

          <div class="form-field">
            <label for="eventDescription">内容・詳細</label>
            <textarea
              id="eventDescription"
              rows="4"
              maxlength="2000"
              placeholder="予定の詳細を入力してください。"
            ></textarea>
          </div>

          <div class="button-row">
            <button type="submit" id="saveEventButton">期間を指定して登録</button>
            <button
              type="button"
              id="cancelEditButton"
              class="secondary-button"
              hidden
            >
              編集をキャンセル
            </button>
          </div>

          <p id="scheduleMessage" class="message" aria-live="polite"></p>
        </form>
      </section>

      <!-- 登録済み予定 -->
      <section class="panel">
        <h2>登録済みの日程</h2>
        <p class="help-text">
          期間登録された予定は、日付ごとに表示されます。
          編集・削除は1日分ずつ行います。
        </p>
        <div id="eventList" class="event-list">
          読み込み中...
        </div>
      </section>

      <!-- カテゴリ管理 -->
      <section class="panel">
        <h2>カテゴリ管理</h2>

        <form id="categoryForm">
          <input type="hidden" id="editingCategoryId">

          <div class="form-field">
            <label for="categoryName">カテゴリ名</label>
            <input
              type="text"
              id="categoryName"
              maxlength="50"
              placeholder="例：部活動"
              required
            >
          </div>

          <div class="form-field">
            <label for="categoryColor">カテゴリカラー</label>
            <div class="color-field">
              <input type="color" id="categoryColor" value="#2774E6" required>
              <span id="categoryColorCode">#2774E6</span>
            </div>
          </div>

          <div class="button-row">
            <button type="submit" id="saveCategoryButton">カテゴリを追加</button>
            <button
              type="button"
              id="cancelCategoryEditButton"
              class="secondary-button"
              hidden
            >
              編集をキャンセル
            </button>
          </div>

          <p id="categoryMessage" class="message" aria-live="polite"></p>
        </form>

        <div id="categoryList" class="category-list">
          読み込み中...
        </div>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
